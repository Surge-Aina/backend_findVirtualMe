name: CI

on:
  pull_request:
    branches: [main]

jobs:
  test:
    name: install-build-test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NODE_ENV: test
      JWT_SECRET: test-only-jwt-secret
      MONGODB_URI: mongodb://127.0.0.1:27017/ci
      MONGODB_URI_TEST: mongodb://127.0.0.1:27017/ci
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test -- --ci --coverage=false
